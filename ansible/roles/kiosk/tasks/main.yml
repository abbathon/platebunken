---
# Chromium on the XFCE session.
#
# ARCHITECTURE.md §8 specified greetd + cage on Wayland. The machine was built with XFCE, so
# this follows the machine and §8 has been rewritten to match rather than left contradicting
# it. One consequence is a gain: XFCE on Debian is X11, and §4.3's blanking plan is `xset`,
# which is X11-only. Under cage there would have been no xset to run.

- name: Where the kiosk user lives
  ansible.builtin.set_fact:
    kiosk_home: "/home/{{ kiosk_user }}"

- name: Directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  loop:
    - "{{ kiosk_home }}/.local/bin"
    - "{{ kiosk_home }}/.config/autostart"
    - "{{ kiosk_home }}/.config/xfce4/xfconf/xfce-perchannel-xml"

- name: The launcher
  ansible.builtin.template:
    src: kiosk.sh.j2
    dest: "{{ kiosk_home }}/.local/bin/platebunken-kiosk.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"

- name: Autostart it with the session
  ansible.builtin.template:
    src: platebunken-kiosk.desktop.j2
    dest: "{{ kiosk_home }}/.config/autostart/platebunken-kiosk.desktop"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"

- name: The idle-watch script
  ansible.builtin.template:
    src: platebunken-idle-watch.sh.j2
    dest: "{{ kiosk_home }}/.local/bin/platebunken-idle-watch.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"

- name: Autostart the idle watch and the screensaver with the session
  ansible.builtin.template:
    src: "{{ item }}.desktop.j2"
    dest: "{{ kiosk_home }}/.config/autostart/{{ item }}.desktop"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  loop:
    - platebunken-idle-watch
    - xscreensaver

- name: xscreensaver's own config
  ansible.builtin.template:
    src: xscreensaver.j2
    dest: "{{ kiosk_home }}/.xscreensaver"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"

- name: Let {{ kiosk_user }} suspend without a polkit prompt nobody is there to answer
  ansible.builtin.template:
    src: 46-platebunken-suspend.rules.j2
    dest: /etc/polkit-1/rules.d/46-platebunken-suspend.rules
    mode: "0644"

- name: No locking screensaver, ever
  # Same tag as the base role's install: apt needs python3-apt on the target to run under
  # --check, so a dry run can skip both and still exercise everything else.
  tags: [packages]
  # §4.3 still forbids a LOCKING screensaver absolutely: a locker in front of a four-year-old
  # who cannot read is a device that has stopped existing. Purged rather than disabled, so a
  # later desktop update cannot quietly bring one back. xscreensaver is no longer in this list
  # — see below — because its own locking is disabled in config (`lock: False`), not by being
  # absent from the machine, and that is the weaker guarantee. These two have no such config
  # knob worth trusting, so absence is still the only guarantee for them.
  ansible.builtin.apt:
    name:
      - xfce4-screensaver
      - light-locker
    state: absent
    purge: true

- name: xscreensaver, and what it needs to know when to suspend
  # §4.3: screensaver at kiosk_screensaver_seconds, real suspend at kiosk_suspend_seconds — see
  # xscreensaver.j2 and platebunken-idle-watch.sh.j2 for why each exists and what stops the
  # suspend half from ever cutting off a record mid-track.
  tags: [packages]
  ansible.builtin.apt:
    name:
      - xscreensaver
      - xprintidle
    state: present

# XFCE settings are written as xfconf XML rather than driven with `xfconf-query`, which
# needs a live D-Bus session and therefore cannot work over SSH. These apply at next login.
- name: XFCE settings for the kiosk session
  ansible.builtin.template:
    src: "{{ item }}.xml.j2"
    dest: "{{ kiosk_home }}/.config/xfce4/xfconf/xfce-perchannel-xml/{{ item }}.xml"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  loop:
    # Clears every XFCE and xfwm shortcut: Alt+F4, Alt+Tab, Super, Ctrl+Alt+Del, workspace
    # switching. Four verbs exist in this product and none of them are these.
    - xfce4-keyboard-shortcuts
    - xfce4-power-manager
    - xfce4-session

- name: System drop-in directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/X11/xorg.conf.d
    - /etc/chromium/policies/managed

- name: No VT switching, no zap
  ansible.builtin.template:
    src: xorg-10-kiosk.conf.j2
    dest: /etc/X11/xorg.conf.d/10-kiosk.conf
    mode: "0644"

- name: Chromium managed policy
  # §8: DeveloperToolsAvailability 2, URLBlocklist ["*"] + an allowlist of exactly one page.
  # ForceEphemeralProfiles stays FALSE on purpose — an ephemeral profile wipes the cover
  # cache on every reboot, and warm covers are what keep a held-down arrow key from showing
  # black squares.
  ansible.builtin.template:
    src: chromium-policy.json.j2
    dest: /etc/chromium/policies/managed/platebunken.json
    mode: "0644"

- name: lightdm has a drop-in directory
  # Not present on a stock trixie XFCE install — the copy below silently did nothing without it.
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    mode: "0755"

- name: Log the kiosk user straight into the session
  # No greeter: this machine has one purpose and nobody types a password at it.
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/50-platebunken.conf
    content: |
      # Managed by Ansible — platebunken/ansible/roles/kiosk.
      [Seat:*]
      autologin-user={{ kiosk_user }}
      autologin-session=xfce
    mode: "0644"
