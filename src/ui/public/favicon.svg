<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Platebunken">
  <!--
    The app mark on its own field. Colours are baked rather than `currentColor`: a favicon is
    rendered outside the page and inherits nothing from it. Amber on near-black, because it has
    to hold up against a light tab strip and a dark one, and the alternative is a mark that
    disappears in whichever theme the browser happens to be wearing.
  -->
  <rect width="64" height="64" rx="14" fill="#ffb84d"/>
  <g fill="#0a0a0c" transform="translate(6.4 6.4) scale(0.8)">
    <rect x="3" y="50" width="58" height="4.5" rx="1.5"/>
    <rect x="5"    y="17" width="3.5" height="33" rx="1"/>
    <rect x="10.5" y="17" width="3.5" height="33" rx="1"/>
    <rect x="16"   y="17" width="3.5" height="33" rx="1"/>
    <rect x="21.5" y="17" width="3.5" height="33" rx="1"/>
    <rect x="27"   y="17" width="3.5" height="33" rx="1"/>
    <path fill-rule="evenodd" transform="rotate(-6 34 50)"
          d="M34 23h27v27H34z
             M47.5 29.9a6.6 6.6 0 1 0 0 13.2 6.6 6.6 0 0 0 0-13.2z"/>
    </g>
</svg>
