<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Platebunken</title>
    <!-- Self-hosted. THE KIOSK HAS NO WAN: a <link> to fonts.googleapis.com worked on every
         machine except the only one that matters, and the numeral face would have silently
         fallen back to a system font on the device it was chosen for. All three candidates
         ship, not just the incumbent, so the comparison can be run in the room it matters in.
         Declared in src/theme/fonts.ts; the files are generated per public/fonts/fonts.css. -->
    <link rel="preload" href="/fonts/archivo-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Copies of brand/. Vite serves this directory's root and cannot reach outside it;
         regenerate both with the recipe in brand/README.md if the mark changes. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
